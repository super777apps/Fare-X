<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fare-X | Admin Panel</title>

<link rel="stylesheet" href="css/style.css">

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
.map {
  height: 300px;
  margin: 10px 0;
  border-radius: 10px;
}

.section {
  margin-top: 20px;
}
</style>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#000000">

<link rel="apple-touch-icon" href="icons/icon-192.png">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

</head>

<body>

<header class="lux-header">
  <h1 class="logo">Fare<span class="gold">-X</span> Admin</h1>
  <button onclick="location.href='index.html'" class="lux-btn">Logout</button>
</header>

<main class="lux-main">

  <h2>Admin Dashboard</h2>

  <!-- USERS -->
  <div class="section">
    <h3>All Users</h3>
    <div id="usersList" class="fare-list"></div>
  </div>

  <!-- JOBS -->
  <div class="section">
    <h3>All Jobs</h3>
    <div id="jobsList" class="fare-list"></div>
  </div>

  <!-- MAP -->
  <div class="section">
    <h3>Live Drivers Map</h3>
    <div id="map" class="map"></div>
  </div>

</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="js/firebase.js"></script>
<script type="module" src="js/admin.js?v=1"></script>


<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/service-worker.js")
      .then(() => console.log("SW registered"))
      .catch(err => console.log("SW failed", err));
  }
</script>
</body>
</html>
