<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fare-X | Help Driver</title>

<link rel="stylesheet" href="css/style.css">

<style>
body{
  background:#000;
  color:#fff;
}

.help-box{
  margin-top:20px;
  padding:15px;
  border-radius:14px;
  background:#111;
  border:1px solid #d4af37;
}

.help-title{
  font-size:18px;
  margin-bottom:10px;
  color:#d4af37;
}

.help-text{
  font-size:14px;
  margin-bottom:10px;
  line-height:1.5;
}

.contact-link{
  color:#d4af37;
  font-weight:bold;
}

.gold-btn{
  margin-top:10px;
  background:#d4af37;
  color:#000;
  border:none;
  padding:12px;
  border-radius:25px;
  width:100%;
  font-weight:bold;
  cursor:pointer;
}

.gold-btn:active{
  transform:scale(0.98);
}
</style>

<link rel="manifest" href="/Fare-X/manifest.json">
<meta name="theme-color" content="#000000">
</head>

<body>

<!-- HEADER -->
<div class="lux-header">
  <div class="logo">Fare<span class="gold">-X</span></div>

  <!-- BACK BUTTON (SAME STYLE AS FRIENDS) -->
  <button onclick="goDashboard()" class="lux-btn">
    ← Back
  </button>
</div>

<div class="lux-main">

  <h2 class="section-title">Help & Support (Driver)</h2>

  <div class="help-box">

    <div class="help-title">Contact Us</div>

    <div class="help-text">
      If you are facing any issue while using Fare-X, please contact us with full details.
    </div>

    <div class="help-text">
      📧 Email:<br>
      <span class="contact-link">faxe7x@gmail.com</span>
    </div>

    <div class="help-text">
      Please include:
      <ul>
        <li>Your account email</li>
        <li>Description of issue</li>
        <li>Screenshots</li>
      </ul>
    </div>

  </div>

  <div class="help-box">

    <div class="help-title">WhatsApp Support</div>

    <div class="help-text">
      📱 +61 431 859 673
    </div>

    <button id="whatsappBtn" class="gold-btn">
      Chat on WhatsApp
    </button>

  </div>

</div>

<script>
/* ✅ SAME STYLE AS FRIENDS.HTML */
function goDashboard(){
  window.location.href = "dashboardDriver.html";
}

/* WhatsApp */
document.getElementById("whatsappBtn").onclick = function(){
  window.open("https://wa.me/61431859673", "_blank");
};
</script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/Fare-X/service-worker.js");
}
</script>

</body>
</html>
