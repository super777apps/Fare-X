<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fare-X | Create Fare</title>

<link rel="stylesheet" href="css/style.css">

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
.map {
  height: 300px;
  margin: 10px 0;
  border-radius: 14px;
  border: 1.5px solid rgba(212,175,55,.5);
  box-shadow: 0 0 15px rgba(212,175,55,.3);
}

.suggestions {
  background:#111;
  border-radius:8px;
  max-height:150px;
  overflow:auto;
  margin-top:5px;
}
.suggestions div {
  padding:8px;
  cursor:pointer;
}
.suggestions div:hover {
  background:#222;
}
</style>

<link rel="manifest" href="/Fare-X/manifest.json">

<meta name="theme-color" content="#000000">

<link rel="apple-touch-icon" href="icons/icon-192.png">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

</head>

<body>

<header class="lux-header">
<h1 class="logo">Fare<span class="gold">-X</span></h1>

<!-- ✅ BIGGER BACK BUTTON -->
<button onclick="location.href='dashboardDriver.html'" class="lux-btn">
← Back
</button>
</header>

<main class="lux-main">

<div class="fare-form">

<h2 class="section-title">Create New Fare</h2>

<!-- PICKUP -->
<input id="pickup" placeholder="Pickup location">
<div id="pickupSuggestions" class="suggestions"></div>
<div id="pickupMap" class="map"></div>

<button id="gpsBtn" class="lux-btn full">Use My Current Location</button>

<!-- DROP -->
<input id="drop" placeholder="Drop location">
<div id="dropSuggestions" class="suggestions"></div>
<div id="dropMap" class="map"></div>

<!-- ✅ PASSENGER SELECT (FIXED POSITION) -->
<select id="passengerSelect">
<option value="">Select Passenger</option>
</select>

<!-- DATE -->
<label class="gold">Trip Date & Time</label>
<input id="datetime" type="datetime-local">

<select id="priceType">
<option value="fixed">Fixed Price</option>
<option value="meter">Meter + Extra</option>
</select>

<input id="price" placeholder="Price">
<textarea id="notes" placeholder="Notes (optional)"></textarea>

<!-- ✅ FIXED ORDER -->
<select id="sendType">
<option value="selfPassenger">Send to Myself + Passenger</option>
<<option value="friend">Send to Driver / Friend</option>
  <option value="broadcast">Broadcast Pool</option>
<<option value="auto" disabled>Auto Dispatch 🔒 Soon</option>
</select>

<select id="friendSelect" style="display:none">
<option value="">Select Driver</option>
</select>

<button id="createFareBtn" class="lux-btn full">Send Fare</button>

<!-- ✅ NEW BUTTON
<button id="longSendBtn" class="lux-btn full" style="display:none;">
Send Until Cancelled / Accepted
</button>
 -->

</div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="js/firebase.js"></script>
<script type="module" src="js/create.js?v=FINAL_FIX_1"></script>


<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/service-worker.js")
      .then(() => console.log("SW registered"))
      .catch(err => console.log("SW failed", err));
  }
</script>
</body>
</html>
