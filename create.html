<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fare-X | Create Fare</title>
<link rel="stylesheet" href="css/style.css">

<!-- ✅ Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
 integrity="sha256-o9N1j6kJ0bY+0b3rLQwb6IoXq0I8bJYgC5Xp2S5r0+o=" crossorigin=""/>

<style>
  #pickupMap { height: 250px; margin: 10px 0; border:1px solid #ccc; border-radius:6px; }
</style>
</head>

<body>

<header class="lux-header">
<h1 class="logo">Fare<span class="gold">-X</span></h1>
<button onclick="location.href='dashboardDriver.html'" class="lux-btn">← Back</button>
</header>

<main class="lux-main">

<div class="fare-form">

<h2>Create New Fare</h2>

<input id="pickup" placeholder="Pickup location">
<div id="pickupMap"></div> <!-- ✅ Leaflet Map -->
<input id="drop" placeholder="Drop location">
<input id="datetime" type="datetime-local">

<select id="priceType">
<option value="fixed">Fixed Price</option>
<option value="meter">Meter + Extra</option>
</select>

<input id="price" placeholder="Price">
<textarea id="note" placeholder="Notes (optional)"></textarea>

<select id="sendType">
<option value="pool">Broadcast Pool</option>
<option value="friend">Send to Driver</option>
<option value="auto">Nearest Driver (Auto Dispatch)</option>
</select>

<select id="friendSelect" style="display:none">
<option value="">Select Driver</option>
</select>

<button id="createFareBtn" class="lux-btn full">Send Fare</button>
<button id="longSendBtn" class="lux-btn full" style="display:none;">Send Fare Until Cancelled / Accepted</button>

</div>

</main>

<!-- ✅ Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
 integrity="sha256-o9N1j6kJ0bY+0b3rLQwb6IoXq0I8bJYgC5Xp2S5r0+o=" crossorigin=""></script>

<script type="module" src="js/firebase.js"></script>
<script type="module" src="js/create.js?v=5"></script>

</body>
</html>
