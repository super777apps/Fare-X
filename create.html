<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fare-X | Create Fare</title>

<link rel="stylesheet" href="css/style.css">

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
/* ✅ ONLY ADDITION (does NOT override your theme) */
#pickupMap, #dropMap {
  height: 300px;
  width: 100%;
  border-radius: 14px;
  margin-bottom: 15px;
  border: 1.5px solid rgba(212,175,55,.5);
}
</style>

</head>

<body>

<header class="lux-header">
  <h1 class="logo">Fare<span class="gold">-X</span></h1>

  <div class="header-nav">
    <button onclick="location.href='dashboardDriver.html'" class="lux-btn small">
      ← Back
    </button>
  </div>
</header>

<main class="lux-main">

<h2 class="section-title">Create New Fare</h2>

<!-- PICKUP -->
<label class="gold">Pickup Location</label>
<input id="pickup" placeholder="Enter pickup location">
<div id="pickupSuggestions" class="suggestions"></div>
<div id="pickupMap"></div>

<button id="gpsBtn" class="lux-btn full">
  Use My Current Location
</button>

<!-- DROP -->
<label class="gold">Drop Location</label>
<input id="drop" placeholder="Enter drop location">
<div id="dropSuggestions" class="suggestions"></div>
<div id="dropMap"></div>

<!-- DATE -->
<label class="gold">Trip Date & Time</label>
<input id="datetime" type="datetime-local">

<!-- PRICE TYPE -->
<label class="gold">Fare Type</label>
<select id="priceType">
  <option value="fixed">Fixed Price</option>
  <option value="meter">Meter + Extra</option>
</select>

<input id="price" placeholder="Enter price">
<textarea id="note" placeholder="Notes (optional)"></textarea>

<!-- SEND TYPE -->
<label class="gold">Send Job</label>
<select id="sendType">
  <option value="pool">Broadcast Pool</option>
  <option value="friend">Send to Driver</option>
  <option value="auto">Nearest Driver (Auto Dispatch)</option>
  <option value="selfPassenger">Send to Myself + Passenger</option>
</select>

<select id="friendSelect" style="display:none">
  <option value="">Select Driver</option>
</select>

<select id="passengerSelect" style="display:none">
  <option value="">Select Passenger</option>
</select>

<button id="createFareBtn" class="lux-btn full">Send Fare</button>

<button id="longSendBtn" class="lux-btn full" style="display:none;">
  Send Until Accepted / Cancelled
</button>

</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="js/firebase.js"></script>
<script type="module" src="js/create.js"></script>

</body>
</html>
