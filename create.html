<!DOCTYPE html>
<html>
<head>
  <title>Create Fare</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="header">Create Fare</div>

<div style="max-width:500px;margin:auto;padding:20px">

  <input id="pickup" placeholder="Pickup location">
  <input id="drop" placeholder="Drop location">
  <input id="time" type="datetime-local">
  <input id="price" placeholder="Price / Meter + $">
  <textarea id="note" placeholder="Notes" style="width:100%;height:80px"></textarea>

  <button id="createFareBtn">Broadcast Fare</button>

</div>

<script type="module" src="js/create.js"></script>

</body>
</html>
