<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Fare | Fare-X</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="lux-header">
  <h1 class="logo">Fare<span class="gold">-X</span></h1>
</header>

<main class="lux-main">

<h2 class="section-title">Create Fare</h2>

<input id="pickup" placeholder="Pickup location">
<input id="drop" placeholder="Drop location">

<label class="lux-label">Pickup Date & Time</label>
<input id="fareTime" type="datetime-local" class="lux-input" required>

<select id="priceType">
  <option value="fixed">Fixed Price</option>
  <option value="meter">Meter + Extra</option>
</select>

<input id="price" placeholder="Fare or extra amount">

<textarea id="note" placeholder="Important notes (optional)"></textarea>

<select id="sendType">
  <option value="broadcast">Broadcast Pool</option>
  <option value="friend">Send To Friend</option>
</select>

<!-- Updated friend dropdown dynamically populated -->
<select id="friendSelect" style="display:none"></select>

<button id="createFareBtn" class="lux-btn full">Send Fare</button>

</main>

<script type="module" src="js/create.js"></script>

</body>
</html>
