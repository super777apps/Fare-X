<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Fare</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
.map { height:250px; margin:10px 0; border-radius:10px; }
.suggestions { background:#111; max-height:150px; overflow:auto; }
.suggestions div { padding:8px; cursor:pointer; }
.suggestions div:hover { background:#222; }
</style>
</head>

<body>

<header class="lux-header">
<h1>Fare-X</h1>
<button onclick="history.back()">← Back</button>
</header>

<main class="lux-main">

<h2>Create Fare</h2>

<!-- PICKUP -->
<label>Pickup Location</label>
<input id="pickup">
<div id="pickupSuggestions" class="suggestions"></div>
<div id="pickupMap" class="map"></div>
<button id="gpsBtn">Use My Current Location</button>

<!-- DROP -->
<label>Drop Location</label>
<input id="drop">
<div id="dropSuggestions" class="suggestions"></div>
<div id="dropMap" class="map"></div>

<!-- PASSENGER -->
<label>Select Passenger</label>
<select id="passengerSelect"></select>

<!-- DATE -->
<label>Trip Date & Time</label>
<input id="datetime" type="datetime-local">

<select id="priceType">
<option>Fixed</option>
<option>Meter +</option>
</select>

<input id="price" placeholder="Price">
<textarea id="note" placeholder="Notes"></textarea>

<select id="sendType">
<option value="friend">Send to Driver</option>
<option value="pool">Broadcast</option>
<option value="auto">Auto Dispatch</option>
<option value="selfPassenger">Myself + Passenger</option>
</select>

<select id="friendSelect" style="display:none"></select>

<button id="createFareBtn">Send Fare</button>

<button id="longSendBtn" style="display:none">
Send Until Accepted / Cancelled
</button>

</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="js/create.js"></script>

</body>
</html>
