<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Fare | Fare-X</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="lux-body">

<header class="lux-header">
  <h1 class="logo">Fare<span class="gold">-X</span></h1>
</header>

<main class="lux-main">

<h2>Create Broadcast Fare</h2>

<input id="pickup" placeholder="Pickup location">
<input id="drop" placeholder="Drop location">

<input id="date" type="date">
<input id="time" type="time">

<select id="priceType">
  <option value="fixed">Fixed Price</option>
  <option value="meter">Meter + Extra</option>
</select>

<input id="price" placeholder="Fare or extra amount">

<textarea id="note" placeholder="Important notes (optional)"></textarea>

<button id="createFareBtn" class="lux-btn full">Broadcast Fare</button>

</main>

<script type="module" src="js/create.js"></script>

</body>
</html>
