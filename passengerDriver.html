<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fare-X | My Drivers</title>
  <link rel="stylesheet" href="css/style.css">
  
<link rel="manifest" href="/Fare-X/manifest.json">

<meta name="theme-color" content="#000000">

<link rel="apple-touch-icon" href="icons/icon-192.png">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  
</head>
<body>

<div class="lux-main">
  <!-- 🔹 FIXED: Back button now calls safe JS function -->
  <<button onclick="goBack()" class="lux-btn full">← Back to Dashboard</button>

<script>
function goBack() {
  // Clear any accidental driver state
  sessionStorage.clear();

  window.location.replace("dashboardPassenger.html");
}
</script>
  <h2 style="text-align:center; margin:20px 0;">My Drivers</h2>

  <input type="text" id="driverSearch" placeholder="Search for driver by nickname">
  <div id="driversList"></div>
</div>

<script type="module" src="js/passengerDriver.js"></script>

<!-- 🔹 SAFE JS BACK FUNCTION -->
<script>
  function goBack() {
    // Force navigation to passenger dashboard (no driver redirect)
    window.location.href = "dashboardPassenger.html";
  }
</script>


<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/Fare-X/service-worker.js");
}
</script>

</body>
</html>
