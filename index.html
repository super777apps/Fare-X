<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fare-X | Login</title>
<link rel="stylesheet" href="css/style.css">

<link rel="manifest" href="/Fare-X/manifest.json">

<meta name="theme-color" content="#000000">

<link rel="apple-touch-icon" href="icons/icon-192.png">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">


</head>
<body>

<div class="lux-main">
  <div class="auth-box">

    <h1 class="auth-title">Fare<span class="gold">-X</span></h1>

    <div class="auth-sub">
      Luxury Dispatch <br>
      - Driver's Own -
    </div>

    <input id="emailInput" type="email" placeholder="Email">
    <input id="passwordInput" type="password" placeholder="Password">

    <button id="loginBtn" class="lux-btn full">Login</button>

    <div style="text-align:center; margin-top:12px;">
      <a href="#" id="forgotBtn" style="color:#d4af37; font-size:14px;">
        Forgot Password?
      </a>
    </div>

    <br>

    <button id="registerDriverBtn" class="lux-btn full">
      Create Driver Account
    </button>

    <br><br>

    <button id="registerPassengerBtn" class="lux-btn full">
      Create Passenger Account
    </button>

  </div>
</div>

<script type="module" src="js/firebase.js"></script>
<script type="module" src="js/auth.js?v=2"></script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/Fare-X/service-worker.js");
}
</script>

<!-- INSTALL POPUP -->
<div id="installBox" style="
position:fixed;
left:15px;
right:15px;
bottom:20px;
background:#111;
color:#FFD700;
padding:18px;
border-radius:14px;
box-shadow:0 0 15px rgba(0,0,0,.5);
z-index:9999;
display:none;
text-align:center;
font-family:Arial;
">

<div style="font-size:22px;font-weight:bold;margin-bottom:8px;">
FareX App
</div>

<div style="font-size:14px;margin-bottom:14px;color:white;">
Install FareX for faster access like a real app
</div>

<button onclick="installFareX()" style="
background:#FFD700;
color:#000;
border:none;
padding:12px 18px;
border-radius:10px;
font-weight:bold;
font-size:16px;
width:100%;
margin-bottom:10px;
">
Install Now
</button>

<button onclick="document.getElementById('installBox').style.display='none'" style="
background:none;
border:none;
color:#aaa;
font-size:14px;
">
Later
</button>

</div>

<script>
let deferredPrompt = null;

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;

  document.getElementById("installBox").style.display = "block";
});

function installFareX() {
  if (deferredPrompt) {
    deferredPrompt.prompt();

    deferredPrompt.userChoice.then(() => {
      deferredPrompt = null;
      document.getElementById("installBox").style.display = "none";
    });
  }
}
</script>

</body>
</html>
