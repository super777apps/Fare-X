<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fare-X | Login</title>
<link rel="stylesheet" href="css/style.css">

<link rel="manifest" href="/Fare-X/manifest.json">

<meta name="theme-color" content="#000000">

<link rel="apple-touch-icon" href="icons/icon-192.png">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">


</head>
<body>

<div class="lux-main">
  <div class="auth-box">

    <h1 class="auth-title">Fare<span class="gold">-X</span></h1>

    <div class="auth-sub">
      Luxury Dispatch <br>
      - Driver's Own -
    </div>

    <input id="emailInput" type="email" placeholder="Email">
    <input id="passwordInput" type="password" placeholder="Password">

    <button id="loginBtn" class="lux-btn full">Login</button>

    <div style="text-align:center; margin-top:12px;">
      <a href="#" id="forgotBtn" style="color:#d4af37; font-size:14px;">
        Forgot Password?
      </a>
    </div>

    <br>

    <button id="registerDriverBtn" class="lux-btn full">
      Create Driver Account
    </button>

    <br><br>

    <button id="registerPassengerBtn" class="lux-btn full">
      Create Passenger Account
    </button>

  </div>
</div>

<script type="module" src="js/firebase.js"></script>
<script type="module" src="js/auth.js?v=2"></script>

<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/service-worker.js")
      .then(() => console.log("SW registered"))
      .catch(err => console.log("SW failed", err));
  }
</script>


</body>
</html>
