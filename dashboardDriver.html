<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fare-X | Driver Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
  
  <link rel="manifest" href="/Fare-X/manifest.json">

<meta name="theme-color" content="#000000">

<link rel="apple-touch-icon" href="icons/icon-192.png">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  
</head>
<body>

<div class="lux-header">
  <div class="logo">Fare<span class="gold">-X</span></div>

  <div>
    <div id="userName"></div>
    <div id="userRole" style="font-size:12px;color:#d4af37;"></div>
    <div id="onlineStatus" style="font-size:12px;"></div>
  </div>

  <button id="logoutBtn" class="lux-btn">Logout</button>
</div>

<div class="lux-main">

  <button id="toggleOnlineBtn" class="lux-btn full"></button>

  <div style="display:flex; flex-direction:column; gap:12px; margin-bottom:20px; margin-top:10px;">

    <button onclick="location.href='create.html'" class="lux-btn full">
      Create Fare
    </button>

    <!-- ✅ NEW BUTTON ADDED (PASSENGERS) -->
    <button onclick="location.href='passenger.html'" class="lux-btn full">
      Passengers
    </button>

    <button onclick="location.href='friends.html'" class="lux-btn full">
      Friends / Drivers
    </button>

    <button onclick="location.href='profile.html'" class="lux-btn full">
      Profile
    </button>

    <button onclick="location.href='help.html'" class="lux-btn full">
      Help
    </button>

    <button id="poolJobsBtn" class="lux-btn full">Broadcast Pool Jobs</button>

    <button id="currentJobsBtn" class="lux-btn full">Current Jobs</button>
    <button id="pastJobsBtn" class="lux-btn full">Past Jobs</button>

  </div>

  <h2 id="jobHeading" class="section-title">Current Jobs</h2>

  <div id="jobList" class="fare-list"></div>

</div>

<!-- Chat Popup -->
<div id="chatModal" class="hidden"
     style="
       position:fixed;
       left:10px;
       right:10px;
       top:60px;
       bottom:20px;
       background:#111;
       border:1px solid #444;
       border-radius:12px;
       z-index:9999;
       padding:10px;
     ">

  <div style="display:flex;justify-content:space-between;align-items:center;">
    <b style="color:#FFD700;">Job Chat</b>

    <button class="lux-btn"
      onclick="document.getElementById('chatModal').classList.add('hidden')">
      Close
    </button>
  </div>

  <div id="chatBox"
       style="
         margin-top:10px;
         height:65%;
         overflow:auto;
         background:#000;
         padding:8px;
         border-radius:8px;
         color:white;
       ">
  </div>

  <div style="display:flex;gap:8px;margin-top:10px;">
    <input id="chatInput"
           placeholder="Type message..."
           style="flex:1;padding:10px;border-radius:8px;border:none;">

    <button class="lux-btn" onclick="sendChat()">Send</button>
  </div>

</div>

<script type="module" src="js/firebase.js"></script>
<script type="module" src="js/dashboardDriver.js?v=6"></script>

<div id="jobPopup" class="job-popup hidden">
  <div class="job-popup-content">
    <h3>🚕 New Job</h3>
    <p id="popupText"></p>
    <button onclick="closePopup()">OK</button>
  </div>
</div>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/Fare-X/service-worker.js");
}
</script>

</body>
</html>
