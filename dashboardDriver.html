<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fare-X | Driver Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="lux-header">
  <div class="logo">Fare<span class="gold">-X</span></div>

  <div style="text-align:right;">
    <div id="userName" style="font-weight:600;"></div>
    <div id="userRole" style="font-size:12px; color:#d4af37;"></div>
  </div>

  <button id="logoutBtn" class="lux-btn">Logout</button>
</div>

<div class="lux-main">

  <div style="display:flex; flex-direction:column; gap:14px;">

    <!-- Create -->
    <button onclick="location.href='create.html'" class="lux-btn full">
      Create Fare
    </button>

    <!-- Friends / Drivers -->
    <button onclick="location.href='friends.html'" class="lux-btn full">
      Friends / Drivers
    </button>

    <!-- Profile -->
    <button onclick="location.href='profile.html'" class="lux-btn full">
      Profile
    </button>

    <!-- Current Jobs -->
    <button id="currentJobsBtn" class="lux-btn full">
      Current Jobs
    </button>

    <!-- Past Jobs -->
    <button id="pastJobsBtn" class="lux-btn full">
      Past Jobs
    </button>

    <!-- Help -->
    <button onclick="location.href='help.html'" class="lux-btn full">
      Help
    </button>

  </div>

  <h2 class="section-title">Jobs</h2>
  <div id="jobList" class="fare-list"></div>

</div>

<script type="module" src="js/dashboardDriver.js"></script>
</body>
</html>
