<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fare-X | Profile</title>

<link rel="stylesheet" href="css/style.css">

<style>
.form-box {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 15px;
}

.preview-img{
  width: 100%;
  max-height: 150px;
  object-fit: cover;
  border-radius: 8px;
  background: #f2f2f2;
}
</style>
<link rel="manifest" href="/Fare-X/manifest.json">

<meta name="theme-color" content="#000000">

<link rel="apple-touch-icon" href="icons/icon-192.png">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">


</head>

<body>

<div class="lux-header">
  <button onclick="goBack()" class="lux-btn">← Back</button>
  <div class="logo">Fare<span class="gold">-X</span></div>
</div>

<div class="lux-main">

  <h2 class="section-title">Profile</h2>

  <div class="form-box">

    <input id="nickName" placeholder="Nickname">
    <input id="email" placeholder="Email" readonly>


<input id="phone" placeholder="Mobile Number +61400112233">

    <input id="firstName" placeholder="First Name">
    <input id="middleName" placeholder="Last Name (Surname)">

    <label>DOB</label>
    <input id="dob" type="date">

    <input id="resAddress" placeholder="Residential Address">
    <input id="postalAddress" placeholder="Postal Address">

    <input id="licenceNo" placeholder="Driving Licence Number">
    <input id="taxiLicence" placeholder="Taxi / Hire Licence Number">

    <input id="carReg" placeholder="Car Registration Number">
    <input id="carMake" placeholder="Car Make & Model">
    <input id="carYear" placeholder="Car Model Year">

    <!-- 📸 PHOTOS -->

    <label>Driver Profile Photo</label>
    <input type="file" id="profilePhoto" accept="image/*">
    <img id="profilePhotoPreview" class="preview-img">

    <label>Licence Front</label>
    <input type="file" id="licenceFront" accept="image/*">
    <img id="licenceFrontPreview" class="preview-img">

    <label>Licence Back</label>
    <input type="file" id="licenceBack" accept="image/*">
    <img id="licenceBackPreview" class="preview-img">

    <label>Taxi Licence Photo</label>
    <input type="file" id="taxiPhoto" accept="image/*">
    <img id="taxiPhotoPreview" class="preview-img">

    <label>Car Registration Photo</label>
    <input type="file" id="carRegPhoto" accept="image/*">
    <img id="carRegPhotoPreview" class="preview-img">

    <label>Car Front Photo (with plate)</label>
    <input type="file" id="carFrontPhoto" accept="image/*">
    <img id="carFrontPhotoPreview" class="preview-img">

    <button id="saveBtn" class="lux-btn full">Save Profile</button>

  </div>

</div>

<script type="module" src="js/profile.js?v=photo"></script>


<script type="module">
import { auth, db } from "./js/firebase.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

window.goBack = async function () {

  const user = auth.currentUser;

  if (!user) {
    location.href = "index.html";
    return;
  }

  const snap = await getDoc(doc(db, "users", user.uid));

  if (!snap.exists()) {
    location.href = "index.html";
    return;
  }

  const role = snap.data().role;

  if (role === "driver") {
    location.href = "dashboardDriver.html";
  }

  else if (role === "passenger") {
    location.href = "dashboardPassenger.html";
  }

  else if (role === "admin") {
    location.href = "admin.html";
  }

  else {
    location.href = "index.html";
  }
};
</script>


<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/service-worker.js")
      .then(() => console.log("SW registered"))
      .catch(err => console.log("SW failed", err));
  }
</script>


<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/Fare-X/service-worker.js");
}
</script>

</body>
</html>
