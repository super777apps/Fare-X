<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driver Profile | Fare-X</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="lux-header">
  <h1 class="logo">Fare<span class="gold">-X</span></h1>
  <button id="logoutBtn" class="lux-btn">Logout</button>
</header>

<main class="lux-main">

<h2 class="section-title">Driver Profile</h2>

<input id="fullName" placeholder="Full Name" required>
<input id="email" placeholder="Email" type="email" required>
<input id="mobile" placeholder="Mobile Number" required>
<input id="nickname" placeholder="Nickname (e.g. Alex BMW)" required>
<input id="carNumber" placeholder="Car Number" required>
<input id="carBrand" placeholder="Car Brand & Model" required>

<button id="saveProfileBtn" class="lux-btn full">Save Profile</button>

</main>

<script type="module" src="js/profile.js"></script>

</body>
</html>
