<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fare-X | Create Fare</title>

<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
.map{
  height:250px;
  width:100%;
  margin:10px 0;
  border-radius:10px;
}

.suggestions{
  background:#111;
  border-radius:8px;
  max-height:150px;
  overflow:auto;
  margin-top:5px;
}

.suggestions div{
  padding:8px;
  cursor:pointer;
}

.suggestions div:hover{
  background:#222;
}
</style>
</head>

<body>

<div class="lux-main">

<button onclick="location.href='dashboardPassenger.html'"
class="lux-btn full">← Back</button>

<h2 class="section-title">Create Fare</h2>

<input id="pickup" placeholder="Pickup location">
<div id="pickupSuggestions" class="suggestions"></div>
<div id="pickupMap" class="map"></div>

<button id="gpsBtn" class="lux-btn full">
Use My Current Location
</button>

<input id="drop" placeholder="Drop location">
<div id="dropSuggestions" class="suggestions"></div>
<div id="dropMap" class="map"></div>

<input id="datetime" type="datetime-local">

<!-- PRICE TYPE -->
<select id="priceType">
  <option value="Fixed Price">Fixed Price</option>
  <option value="Meter + Extra">Meter + Extra</option>
</select>

<!-- PRICE -->
<input id="price" placeholder="Enter Price / Extra">

<!-- NOTES -->
<textarea id="notes" placeholder="Notes (bags, baby seat, waiting, gate no, etc)"></textarea>
<select id="driverSelect">
<option value="">Select Driver</option>
</select>

<button id="createFareBtn" class="lux-btn full">
Send to Driver
</button>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module" src="js/createPassenger.js?v=2"></script>

</body>
</html>
