<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fare-X | Create Fare</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="lux-main">
  <button onclick="location.href='dashboardPassenger.html'" class="lux-btn full">← Back to Dashboard</button>
  <h2 style="text-align:center; margin:20px 0;">Create Fare</h2>

  <input type="text" id="pickup" placeholder="Pickup Location">
  <input type="text" id="drop" placeholder="Drop Location">
  <input type="datetime-local" id="datetime">
  <input type="text" id="price" placeholder="Fare Price">

  <select id="driverSelect">
    <option value="">Select Driver</option>
  </select>

  <button id="createFareBtn" class="lux-btn full">Send to Driver</button>
</div>

<script type="module" src="js/createPassenger.js"></script>
</body>
</html>
