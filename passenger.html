<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fare-X | Passengers</title>

<link rel="stylesheet" href="css/style.css">

<style>
.search-box {
  margin-bottom: 10px;
}

.result-item {
  padding:10px;
  border-bottom:1px solid #222;
  cursor:pointer;
}

.result-item:hover {
  background:#111;
}
</style>

<<link rel="manifest" href="/Fare-X/manifest.json">

<meta name="theme-color" content="#000000">

<link rel="apple-touch-icon" href="icons/icon-192.png">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

</head>

<body>

<div class="lux-header">
  <!-- ✅ BACK BUTTON (FIXED) -->
  <button onclick="goBack()" class="lux-btn">← Back</button>
  <div class="logo">Fare<span class="gold">-X</span></div>
</div>

<div class="lux-main">

  <h2 class="section-title">Passengers</h2>

  <!-- SEARCH -->
  <input id="searchInput" class="search-box" placeholder="Search passenger by email">

  <div id="searchResults"></div>

  <h3 class="section-title">My Passengers</h3>
  <div id="passengerList" class="fare-list"></div>

</div>

<script type="module" src="js/passenger.js?v=BACKFIX"></script>

<!-- ✅ STRONG BACK FIX -->
<script>
function goBack(){

  // Always prefer explicit driver return
  const lastPage = sessionStorage.getItem("fromPage");

  if(lastPage === "driver"){
    location.href = "dashboardDriver.html";
    return;
  }

  // fallback (safety)
  location.href = "dashboardDriver.html";
}
</script>

<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/service-worker.js")
      .then(() => console.log("SW registered"))
      .catch(err => console.log("SW failed", err));
  }
</script>


</body>
</html>
