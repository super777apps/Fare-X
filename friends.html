<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fare-X | Drivers</title>
  <link rel="stylesheet" href="css/style.css">
  
<link rel="manifest" href="/Fare-X/manifest.json">
<meta name="theme-color" content="#000000">

<link rel="apple-touch-icon" href="icons/icon-192.png">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  
</head>
<body>

<!-- HEADER -->
<div class="lux-header">
  <div class="logo">Fare<span class="gold">-X</span></div>

  <!-- ✅ FIXED BACK BUTTON -->
  <button onclick="goDashboard()" class="lux-btn">
    ← Back
  </button>
</div>

<div class="lux-main">

  <h2 class="section-title">My Drivers</h2>

  <!-- SEARCH -->
  <input id="searchInput" placeholder="Search driver by nickname">

  <button id="searchBtn" class="lux-btn full">
    Search Driver
  </button>

  <!-- SEARCH RESULTS -->
  <div id="searchResults" class="fare-list"></div>

  <!-- MY DRIVERS -->
  <h2 class="section-title">Your Drivers</h2>
  <div id="driversList" class="fare-list"></div>

</div>

<script type="module" src="js/firebase.js"></script>
<script type="module" src="js/friends.js"></script>

<!-- ✅ HARD NAVIGATION FIX -->
<script>
function goDashboard() {
  window.location.href = "dashboardDriver.html";
}
</script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/Fare-X/service-worker.js");
}
</script>

</body>
</html>
