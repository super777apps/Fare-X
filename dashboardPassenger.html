<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fare-X | Passenger Dashboard</title>

  <link rel="stylesheet" href="css/style.css">

  <!-- ✅ REQUIRED FOR MAP -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  
  <link rel="manifest" href="/Fare-X/manifest.json">

<meta name="theme-color" content="#000000">

<link rel="apple-touch-icon" href="icons/icon-192.png">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  
</head>

<body>

<!-- HEADER -->
<div class="lux-header">
  <div class="logo">Fare<span class="gold">-X</span></div>

  <div style="text-align:right;">
    <div id="userName" style="font-weight:600;"></div>
    <div id="userRole" style="font-size:12px; color:#d4af37;"></div>
  </div>
</div>

<div class="lux-main">

  <!-- BUTTONS -->
  <div style="display:flex; flex-direction:column; gap:14px;">

  <button id="createFareBtn" class="lux-btn full">Create Fare</button>

  <button id="driversBtn" class="lux-btn full">Drivers</button>

  <button id="profileBtn" class="lux-btn full">Profile</button>

  <button id="currentJobsBtn" class="lux-btn full">Current Jobs</button>

  <button id="pastJobsBtn" class="lux-btn full">Past Jobs</button>

  <button id="helpBtn" class="lux-btn full">Help</button>

  <button id="logoutBtn" class="lux-btn full danger">Logout</button>

</div>

  <!-- JOBS -->
  <h2 class="section-title" style="margin-top:30px;">My Jobs</h2>
  <div id="jobsList" class="fare-list"></div>

</div>


<!-- Chat Popup -->
<div id="chatModal" class="hidden"
     style="
       position:fixed;
       left:10px;
       right:10px;
       top:60px;
       bottom:20px;
       background:#111;
       border:1px solid #444;
       border-radius:12px;
       z-index:9999;
       padding:10px;
     ">

  <div style="display:flex;justify-content:space-between;align-items:center;">
    <b style="color:#FFD700;">Job Chat</b>

    <button class="lux-btn"
      onclick="document.getElementById('chatModal').classList.add('hidden')">
      Close
    </button>
  </div>

  <div id="chatBox"
       style="
         margin-top:10px;
         height:65%;
         overflow:auto;
         background:#000;
         padding:8px;
         border-radius:8px;
         color:white;
       ">
  </div>

  <div style="display:flex;gap:8px;margin-top:10px;">
    <input id="chatInput"
           placeholder="Type message..."
           style="flex:1;padding:10px;border-radius:8px;border:none;">

    <button class="lux-btn" onclick="sendChat()">Send</button>
  </div>

</div>

<!-- ✅ REQUIRED FOR MAP -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="js/firebase.js"></script>
<script type="module" src="js/dashboardPassenger.js"></script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/Fare-X/service-worker.js");
}
</script>

</body>
</html>
