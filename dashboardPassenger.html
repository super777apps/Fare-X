<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fare-X | Passenger Dashboard</title>

  <link rel="stylesheet" href="css/style.css">

  <!-- ✅ REQUIRED FOR MAP -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
</head>

<body>

<!-- HEADER -->
<div class="lux-header">
  <div class="logo">Fare<span class="gold">-X</span></div>

  <div style="text-align:right;">
    <div id="userName" style="font-weight:600;"></div>
    <div id="userRole" style="font-size:12px; color:#d4af37;"></div>
  </div>
</div>

<div class="lux-main">

  <!-- BUTTONS -->
  <div style="display:flex; flex-direction:column; gap:14px;">

    <button id="createFareBtn" class="lux-btn full">Create Fare</button>
    <button id="driversBtn" class="lux-btn full">Drivers</button>
    <button id="profileBtn" class="lux-btn full">Profile</button>
    <<button id="currentJobsBtn" class="lux-btn full">Current Jobs</button>
<button id="pastJobsBtn" class="lux-btn full">Past Jobs</button>
    <button id="helpBtn" class="lux-btn full">Help</button>

    <button id="logoutBtn" class="lux-btn full danger">Logout</button>

  </div>

  <!-- JOBS -->
  <h2 class="section-title" style="margin-top:30px;">My Jobs</h2>
  <div id="jobsList" class="fare-list"></div>

</div>

<!-- ✅ REQUIRED FOR MAP -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module" src="js/firebase.js"></script>
<script type="module" src="js/dashboardPassenger.js?v=FINAL"></script>
<script type="module" src="js/dashboardPassenger.js?v=NEW3"></script>

</body>
</html>
