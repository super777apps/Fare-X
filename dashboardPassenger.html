<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fare-X | Passenger Dashboard</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="lux-header">
  <div class="logo">Fare<span class="gold">-X</span></div>
  <div>
    <span id="passengerName" class="gold"></span> |
    <span id="passengerRole" class="gold"></span>
  </div>
</div>

<div class="lux-main" id="passengerMain">

  <!-- Dashboard buttons -->
  <div class="dashboard-buttons" style="display:flex; gap:16px; flex-wrap:wrap; margin-bottom:20px;">
    <button id="createFareBtn" class="lux-btn">Create Fare</button>
    <button id="driversBtn" class="lux-btn">Drivers</button>
    <button id="profileBtn" class="lux-btn">Profile</button>
    <button id="logoutBtn" class="lux-btn danger">Logout</button>
  </div>

  <!-- Container for content -->
  <div id="passengerContent"></div>

</div>

<script type="module" src="js/passengerDashboard.js"></script>
</body>
</html>
